<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Simple Todo App</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <!-- <link rel="stylesheet" href="styles.css"> -->
</head>

<body>
    <!-- App Container -->
    <div id="app" class="app">
        <!-- Authentication Section -->
        <div id="auth-section" class="auth-section min-vh-100 d-flex align-items-center">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-md-6 col-lg-5">
                        <div class="auth-container">
                            <div class="auth-header text-center mb-4">
                                <h1 class="display-5 fw-bold text-primary"><i class="fas fa-tasks me-3"></i>Simple Todo
                                </h1>
                                <p class="lead text-muted">Join thousands of productive users</p>
                            </div>

                            <!-- Registration Form -->
                            <div id="register-form" class="auth-form">
                                <div class="card border-0 shadow-lg">
                                    <div class="card-body p-5">
                                        <h2 class="card-title text-center mb-4 fw-bold">Create Your Account</h2>
                                        <form class="form" action="dashboard.html" method="post">
                                            <div class="mb-3">
                                                <label for="register-username" class="form-label fw-semibold">Full
                                                    Name</label>
                                                <div class="input-group input-group-lg">
                                                    <span class="input-group-text bg-light border-end-0">
                                                        <i class="fas fa-user text-primary"></i>
                                                    </span>
                                                    <input type="text" id="register-username" name="username"
                                                        class="form-control border-start-0 border-end-0 ps-0"
                                                        placeholder="Enter your full name" required>
                                                </div>
                                            </div>
                                            <div class="mb-3">
                                                <label for="register-email" class="form-label fw-semibold">Email
                                                    Address</label>
                                                <div class="input-group input-group-lg">
                                                    <span class="input-group-text bg-light border-end-0">
                                                        <i class="fas fa-envelope text-primary"></i>
                                                    </span>
                                                    <input type="email" id="register-email" name="email"
                                                        class="form-control border-start-0 border-end-0 ps-0"
                                                        placeholder="Enter your email" required>
                                                </div>
                                            </div>
                                            <div class="mb-3">
                                                <label for="register-password"
                                                    class="form-label fw-semibold">Password</label>
                                                <div class="input-group input-group-lg">
                                                    <span class="input-group-text bg-light border-end-0">
                                                        <i class="fas fa-lock text-primary"></i>
                                                    </span>
                                                    <input type="password" id="register-password" name="password"
                                                        class="form-control border-start-0 border-end-0 ps-0"
                                                        placeholder="Create a strong password" required>
                                                    <button type="button"
                                                        class="input-group-text bg-light password-toggle border-start-0">
                                                        <i class="fas fa-eye text-muted"></i>
                                                    </button>
                                                </div>
                                            </div>
                                            <div class="mb-4">
                                                <label for="register-confirm-password"
                                                    class="form-label fw-semibold">Confirm Password</label>
                                                <div class="input-group input-group-lg">
                                                    <span class="input-group-text bg-light border-end-0">
                                                        <i class="fas fa-shield-alt text-primary"></i>
                                                    </span>
                                                    <input type="password" id="register-confirm-password"
                                                        name="confirmPassword"
                                                        class="form-control border-start-0 border-end-0 ps-0"
                                                        placeholder="Confirm your password" required>
                                                    <button type="button"
                                                        class="input-group-text bg-light password-toggle border-start-0">
                                                        <i class="fas fa-eye text-muted"></i>
                                                    </button>
                                                </div>
                                            </div>
                                            <button type="submit"
                                                class="btn btn-primary btn-lg w-100 mb-4 py-3 fw-semibold">
                                                <i class="fas fa-user-plus me-2"></i>
                                                Create My Account
                                            </button>
                                        </form>
                                        <div class="text-center">
                                            <p class="mb-3">Already have an account? <a href="login.html"
                                                    class="text-decoration-none fw-semibold">Sign in here</a></p>
                                            <p><a href="index.html" class="text-decoration-none text-muted">
                                                    <i class="fas fa-arrow-left me-1"></i>Back to Home</a></p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notifications Container (for future JS implementation) -->
    <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
